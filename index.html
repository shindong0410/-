<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 비주얼 포트폴리오</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
    }

    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 800px;
      gap: 24px;
    }

    .cell {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    /* 마우스를 올렸을 때 부드럽게 커지는 효과 */
    .cell:hover {
      transform: translateY(-5px);
      border-color: #6366f1;
    }

    .project-title {
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #111827;
      color: #e2e8f0;
      border-bottom: 1px solid #334155;
    }

    /* iframe을 감싸는 컨테이너 */
    .iframe-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10; /* 비율을 살짝 넓혀 가독성 확보 */
      overflow: hidden;
      background: #000;
    }

    /* iframe 크기를 반으로 줄여 모바일 화면처럼 쏙 넣는 기술 */
    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      border: none;
      transform: scale(0.5);
      transform-origin: top left;
    }
  </style>
</head>
<body>

  <header>
    <h1>p5.js 비주얼 포트폴리오</h1>
    <p class="subtitle">과제 1부터 과제 4까지의 여정</p>
  </header>

  <main id="projects">

    <div class="cell">
      <div class="project-title">과제 1: 정적 작품 I</div>
      <div class="iframe-container">
        <iframe src="sample1/index.html"></iframe>
      </div>
    </div>

    <div class="cell">
      <div class="project-title">과제 4: 동적 작품 II</div>
      <div class="iframe-container">
        <iframe src="sample4/index.html"></iframe>
      </div>
    </div>

    <div class="cell">
      <div class="project-title">과제 2: 정적 작품 II</div>
      <div class="iframe-container">
        <iframe src="sample2/index.html"></iframe>
      </div>
    </div>

    <div class="cell">
      <div class="project-title">과제 3: 동적 작품 I</div>
      <div class="iframe-container">
        <iframe src="sample3/index.html"></iframe>
      </div>
    </div>

  </main>

</body>
</html>
